# Tuned runtime preset for small_cap_squeeze.
# Long-only, multi-regime small-cap "squeeze" strategy. No fixed tradable list —
# a dynamic TradingView screener picks low-float names gapping premarket on heavy
# volume. Reuses the top_tier_adaptive engine, narrowed (2026-06-02) to the
# momentum-continuation regimes: trend / momentum / vwap_reclaim
# (pullback / range / vol_squeeze / ORB / sr_scalp off).
# See intraday_tv_schwab_bot/_strategies/small_cap_squeeze/README.md.
# Put SCHWAB_APP_KEY, SCHWAB_APP_SECRET, SCHWAB_ACCOUNT_HASH, SCHWAB_ENCRYPTION_KEY,
# and TRADINGVIEW_SESSIONID in a .env file at the repo root (see .env.example).
#
# Fully-explicit preset: every engine section the strategy reads is declared
# here (mirrors config.top_tier_adaptive.yaml's structure) so no behavior is
# left to hidden dataclass defaults. Shared sections carry top_tier's known-good
# values; small-cap-specific overrides are called out inline.

strategy: small_cap_squeeze

schwab:
  callback_url: https://127.0.0.1
  tokens_db: .schwabdev/tokens.db
  timeout: 10
  dry_run: true
  open_browser_for_auth: true

# Broad TradingView fetch knobs. The real per-symbol squeeze filters (float /
# price / RVOL / change-from-open / volume / cap) live in the strategy params
# block below; the floors here are kept permissive so they don't pre-filter the
# universe before the strategy's own (stricter) screen runs.
tradingview:
  market: america
  max_candidates: 20
  screener_refresh_seconds: 30
  min_market_cap: 1000000
  max_market_cap: 2000000000
  min_volume: 100000
  min_value_traded_1m: 0.0
  min_volume_1m: 1000

paper:
  starting_equity: 50000.0
  max_equity_points: 2000
  max_trade_history: 200

# Position sizing / management. Long-only. Small caps swing 5-20%+, so the
# default_stop_pct FLOOR is wider than the mega-cap preset and per-trade notional
# is smaller — the risk manager downsizes share count on the (wide) ATR-based
# structural stops to keep dollar risk per trade roughly constant.
risk:
  max_positions: 4
  risk_per_trade_frac_of_notional: 0.008
  max_notional_per_trade: 6000.0
  max_total_notional: 24000.0
  max_daily_loss: 600.0
  default_stop_pct: 0.03
  default_target_pct: 0.06
  trailing_stop_pct: 0.05   # 2026-06-01 dry-run: wider runner trail (3% exited on routine intra-move pullbacks); applies to the non-ladder fallback
  trade_management_mode: adaptive_ladder
  allow_short: false
  cooldown_minutes: 5
  reentry_policy: cooldown
  cooldown_direction_aware: true
  same_level_block_minutes: 15
  same_level_block_atr_mult: 0.3
  time_stop_minutes: 30
  time_stop_min_return_pct: 0.005
  peak_giveback_enabled: true
  peak_giveback_min_r: 1.0
  peak_giveback_low_tier_enabled: true
  peak_giveback_low_tier_min_r: 0.7
  peak_giveback_low_tier_giveback_frac: 0.7
  peak_giveback_retain_1to2r: 0.6
  peak_giveback_retain_2to3r: 0.7
  peak_giveback_retain_3r_plus: 0.78

runtime:
  loop_sleep_seconds: 2.0
  history_poll_seconds: 300
  quote_poll_seconds: 6
  quote_cache_seconds: 6
  quote_batch_size: 20
  history_lookback_minutes: 780
  use_extended_hours_history: true
  use_rth_session_indicators: true
  # Premarket trading: anchor the per-session VWAP/EMA reset to the 07:00-20:00
  # equity stream so the 08:05-09:30 premarket bars carry meaningful indicators.
  equity_session_indicator_window: extended
  warmup_minutes: 60
  prewarm_before_windows_minutes: 15
  log_dir: .logs
  stream_fields: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  stream_connect_timeout_seconds: 20
  stream_fallback_poll_seconds: 25
  stream_stale_fallback_seconds: 180
  stream_health_log_seconds: 90
  auto_exit_after_session: true
  idle_sleep_seconds: 60.0
  symbol_state_prune_seconds: 1800.0
  session_reconcile_on_resume: true
  cycle_precompute_workers: 4
  max_consecutive_quote_failures: 5
  export_session_archive: true
  reconcile_on_startup: true
  startup_reconcile_mode: ignore
  startup_order_lookback_days: 2
  startup_reconcile_ignore_symbols: []
  startup_reconcile_metadata_db_path: .logs/startup_reconcile_metadata.sqlite

execution:
  # Marketable-limit buffers widened from the mega-cap preset (was 0.03 / 0.05 /
  # 0.10 / 2 attempts). The buffer is a fixed DOLLAR amount — a buy submits at
  # ask + buffer, clamped to [min_buffer, max_buffer] with a spread-scaled term
  # in between: raw = max(0.01, min_buffer, spread * spread_frac); capped at
  # max_buffer (execution.py:_marketable_limit_buffer / _equity_limit_price).
  # Small-cap squeezers have wider spreads and faster tick movement, so the
  # mega-cap 3-5c clamp left the limit non-marketable and missed fills on fast
  # moves. spread_frac 0.30 lets the buffer track the actual spread; max_buffer
  # 0.15 gives headroom for the widest books; 3 reprice attempts chase a moving
  # ask. NOTE: dry-run fills marketable limits at the natural price regardless of
  # buffer (execution.py:_simulate_equity_fill), so this only affects LIVE fills.
  entry_limit_min_buffer: 0.04
  entry_limit_max_buffer: 0.15
  entry_limit_spread_frac: 0.30
  entry_live_fill_timeout_seconds: 2.0
  entry_live_poll_seconds: 0.25
  entry_live_reprice_attempts: 3
  entry_live_reprice_step_frac: 0.33
  # Premarket entries require extended-hours orders.
  extended_hours_enabled: true
  market_exit_regular_hours: false

# Candle-pattern inputs used by the engine's candle context (single/2/3-bar
# reversal patterns). Long-only here; the bearish set feeds opposing-pattern
# entry filtering and exit context, so it is retained.
candles:
  bullish_patterns:
    - bullish_1c
    - bullish_2c
    - bullish_3c
  bearish_patterns:
    - bearish_1c
    - bearish_2c
    - bearish_3c

# Higher-level chart-pattern detection. lookback_bars is in base-1m bars
# (= 32 min). In this engine (top_tier's) chart patterns only SCORE: a matched
# same-side pattern adds +0.35 (continuation) or +0.15 (reversal) to the
# entry score. Nothing blocks on them: shared_entry.use_opposing_chart_filter
# is false here (parity; the engine never read it before 2026-09-24) and
# use_chart_pattern_exit is off.
# Long-only, so the bearish set changes no decision; it only feeds the
# dashboard's pattern tooltip.
chart_patterns:
  enabled: true
  lookback_bars: 32
  bullish_patterns:
    - bullish_double_bottom
    - bullish_inverse_head_and_shoulders
    - bullish_falling_wedge
    - bullish_broadening_bottom
    - bullish_triple_bottom
    - bullish_flag
    - bullish_pennant
    - bullish_ascending_triangle
    - bullish_symmetrical_triangle
  bearish_patterns:
    - bearish_double_top
    - bearish_head_and_shoulders
    - bearish_rising_wedge
    - bearish_broadening_top
    - bearish_triple_top
    - bearish_flag
    - bearish_pennant
    - bearish_descending_triangle
    - bearish_symmetrical_triangle

# Dashboard server, charting, and HTTPS settings. compact_chart_timeframe: ltf
# draws the 1m LTF the strategy trades on, with the strategy's own LTF EMAs
# (ltf_ema_fast_span / ltf_ema_slow_span, 9 / 20). The HTF chart draws the HTF
# EMAs the strategy's HTF EMA trend reads (htf_ema_fast_span / _slow_span).
dashboard:
  enabled: true
  host: 127.0.0.1
  port: 8765
  refresh_ms: 1500
  state_path: .logs/dashboard_state.json
  theme: default
  https: false
  ssl_certfile: ""
  ssl_keyfile: ""
  charting:
    compact_chart_timeframe: ltf
    compact:
      max_bars: 90
      show_volume: true
      show_moving_averages: true
      show_vwap: true
      show_support_resistance: true
      show_next_support_resistance: true
      show_full_support_resistance_ladder: false
      show_key_level_zones: true
      show_key_level_zone_labels: true
      show_bollinger_bands: false
      show_anchored_vwap: false
      show_fib_extensions: false
      show_fib_retracements: false
      show_channel: false
      show_trendlines: false
      show_htf_fair_value_gaps: false
      show_ltf_fair_value_gaps: true
      show_htf_order_blocks: false
      show_ltf_order_blocks: false
      show_rsi_divergence: true
      show_obv_divergence: false
      show_trade_markers: true
      tooltip_show_returns: true
      tooltip_show_support_resistance: true
      tooltip_show_structure: true
      tooltip_show_volatility: true
      tooltip_show_orderflow: true
      tooltip_show_patterns: true
    expanded:
      max_bars: 360
      show_volume: true
      show_moving_averages: true
      show_vwap: true
      show_support_resistance: true
      show_next_support_resistance: true
      show_full_support_resistance_ladder: true
      show_key_level_zones: true
      show_key_level_zone_labels: true
      show_bollinger_bands: true
      show_anchored_vwap: false
      show_fib_extensions: true
      show_fib_retracements: true
      show_channel: true
      show_trendlines: true
      show_htf_fair_value_gaps: true
      show_ltf_fair_value_gaps: true
      show_htf_order_blocks: false
      show_ltf_order_blocks: false
      show_rsi_divergence: true
      show_obv_divergence: false
      show_trade_markers: true
      tooltip_show_returns: true
      tooltip_show_support_resistance: true
      tooltip_show_structure: true
      tooltip_show_volatility: true
      tooltip_show_orderflow: true
      tooltip_show_patterns: true

# Support/resistance level map + structure + FVG tuning. Values mirror the
# top_tier preset (ATR-relative, so they auto-scale to small-cap prices) EXCEPT
# the small-cap overrides flagged below.
support_resistance:
  enabled: true
  timeframe_minutes: 15
  lookback_days: 10
  pivot_span: 2
  max_levels_per_side: 4           # 4 (vs default 3) = more ladder rungs: more stop/target steps
  atr_tolerance_mult: 0.6
  pct_tolerance: 0.003
  same_side_min_gap_atr_mult: 0.1
  same_side_min_gap_pct: 0.0015
  fallback_reference_max_drift_atr_mult: 1.0
  fallback_reference_max_drift_pct: 0.01
  proximity_atr_mult: 0.7
  breakout_atr_mult: 0.3
  breakout_buffer_pct: 0.0012
  stop_buffer_atr_mult: 0.25
  # OVERRIDE: looser entry-vs-opposing-SR clearance than the SR defaults (0.85
  # ATR / 0.38%, stricter even than top_tier's 0.72 / 0.25%). A squeeze trades
  # INTO and THROUGH levels, so the default clearance would reject exactly the
  # near-resistance breakout entries this strategy exists to take. The
  # reject_target_beyond_sr strategy param still guards against buying a
  # hard ceiling (the broken-level guard, shared_entry.use_broken_level_guard,
  # ships off since 2026-09-24).
  entry_min_clearance_atr: 0.55
  entry_min_clearance_pct: 0.0020
  entry_proximity_scoring_enabled: true
  entry_bias_score_weight: 0.5
  entry_favorable_proximity_bonus: 0.3
  entry_opposing_proximity_penalty: 0.3
  use_prior_day_high_low: true
  use_prior_week_high_low: true
  htf_fair_value_gaps_enabled: true
  fair_value_gap_max_per_side: 3
  fair_value_gap_min_atr_mult: 0.06
  fair_value_gap_min_pct: 0.0006
  ltf_fair_value_gaps_enabled: true
  ltf_order_blocks_enabled: false
  htf_order_blocks_enabled: false
  order_block_mode: loose
  order_block_max_per_side: 4
  order_block_min_atr_mult: 0.05
  order_block_min_pct: 0.0005
  order_block_min_thrust_atr_mult: 0.75
  order_block_pivot_span: 2
  order_block_new_high_lookback: 8
  trading_flip_confirmation_1m_bars: 2
  trading_flip_confirmation_5m_bars: 1
  flip_stop_buffer_atr_mult: 0.25
  flip_target_requires_momentum_confirm: true
  regime_weight: 0.7
  structure_enabled: true
  structure_ltf_pivot_span: 2
  structure_eq_atr_mult: 0.25
  structure_ltf_weight: 0.65
  structure_htf_weight: 0.95
  # OVERRIDE: de-noise the LTF structure frame to 5m (entries still run on the
  # 1m LTF; only BOS/CHoCH structure + structure-based EXITS use the coarser
  # frame). The bar-count companions are sized for that 5m frame.
  structure_ltf_timeframe_minutes: 5
  structure_event_lookback_bars: 4      # = 20 min on the 5m structure frame
  # HTF window, in 15m HTF bars. The line above is sized for the 5m LTF
  # structure frame; until 2026-09-22 it sized the HTF one too, so halving
  # it for 5m bars cut HTF BOS/CHoCH freshness from 120 to 60 minutes under
  # the HTF bias entry gate. 8 restores 120.
  htf_structure_event_lookback_bars: 8
  structure_min_pivot_gap_bars: 3       # = 15 min minimum between swings
  structure_min_range_atr_mult: 1.5
  structure_exit_grace_minutes_pullback: 15
  structure_exit_require_bos_confirmation: true

# Technical indicator-derived levels and overlay scoring. Computed on the BASE
# 1-minute frame. Values mirror top_tier EXCEPT the three extension PENALTIES,
# which are zeroed for this strategy.
technical_levels:
  enabled: true
  fib_enabled: true
  fib_lookback_bars: 120
  fib_min_impulse_atr: 1.25
  fib_near_extension_pct: 0.0055
  channel_enabled: true
  channel_lookback_bars: 120
  channel_min_touches: 3
  channel_atr_tolerance_mult: 0.35
  channel_parallel_slope_frac: 0.12
  channel_min_gap_atr_mult: 0.8
  channel_min_gap_pct: 0.0025
  channel_near_edge_pct: 0.16
  trendline_enabled: true
  trendline_lookback_bars: 120
  trendline_min_touches: 3
  trendline_atr_tolerance_mult: 0.35
  # 2026-09-23: kept at 0.15. The large-cap presets moved to 0.65 because a
  # 0.10%-of-price floor used to decide their buffer; on small-cap tape (ATR
  # a median 2.6% of price) 0.15 x ATR beat that floor on 99.9% of bars
  # (small_cap_squeeze archive 06-01..03), so 0.15 IS the buffer this preset
  # has always used. 0.65 made breaks need a 4.3x larger move here.
  trendline_breakout_buffer_atr_mult: 0.15
  adx_enabled: true
  adx_length: 14
  adx_min_strength: 18.0
  adx_entry_bonus: 0.2
  adx_rising_bonus: 0.08
  adx_weak_penalty: 0.12
  anchored_vwap_enabled: true
  anchored_vwap_entry_bonus: 0.2
  anchored_vwap_entry_penalty: 0.18
  atr_context_enabled: true
  atr_expansion_lookback: 5
  atr_expansion_min_mult: 0.8
  atr_expansion_bonus: 0.12
  atr_stretch_penalty_mult: 2.6
  # OVERRIDE (extension penalty 1/3): a squeezer sits far above VWAP by design.
  atr_stretch_penalty: 0.0
  obv_enabled: true
  obv_ema_length: 20
  obv_entry_bonus: 0.1
  obv_entry_penalty: 0.08
  divergence_enabled: true
  divergence_rsi_length: 14
  divergence_rsi_min_delta: 2.5
  divergence_obv_min_volume_frac: 0.65
  divergence_counter_rsi_penalty: 0.10
  divergence_counter_obv_penalty: 0.08
  divergence_pivot_lookback: 4
  divergence_max_age_bars: 8
  divergence_min_price_move_pct: 0.0015
  divergence_hidden_bonus_rsi: 0.10
  divergence_hidden_bonus_obv: 0.08
  htf_divergence_aligned_bonus_rsi: 0.20
  htf_divergence_counter_penalty_rsi: 0.25
  htf_divergence_hidden_bonus_rsi: 0.10
  bollinger_enabled: true
  bollinger_length: 20
  bollinger_std_mult: 2.0
  # 2026-09-22: was 0.06 -- which, unlike on large caps, was NOT a units error
  # here: small caps' 1m bands are wide (median width 0.117 of price) and 0.06
  # flagged 16.4% of RTH bars. Set to the p25, 0.076, so the flag means what it
  # means in every other preset -- the tightest quarter of the tape. Thin
  # evidence: 1,646 RTH bars from 9 symbol-days (2026-06-01..03 dry-runs),
  # per-symbol-day p25 0.043-0.135. Re-measure once more sessions exist.
  bollinger_squeeze_width_pct: 0.076
  bollinger_entry_bonus_midband: 0.16
  # OVERRIDE (extension penalty 2/3): a squeezer rides the upper band by design.
  bollinger_entry_penalty_outer_band: 0.0
  target_use_bollinger: false
  target_use_fib: true
  target_use_channel: true
  target_use_trendline: true
  stop_use_trendline: true
  entry_bonus_channel_alignment: 0.2
  entry_bonus_trendline_respect: 0.2
  # OVERRIDE (extension penalty 3/3): a squeezer runs through fib extensions by
  # design. The HARD extension gates are also off in the strategy params
  # (reject_stretched_entries, etc.); these were their soft-scoring twins and
  # would otherwise dock 0.2-0.6 of score from nearly every entry against the
  # 3.0-3.5 min-score floors. Raise back toward 0.22/0.20/0.40 if dry-run shows
  # entries chasing blow-off tops.
  entry_penalty_near_extension: 0.0

# Shared entry knobs. Global since 2026-09-24: each one acts on this strategy
# through the shared entry stage. Values are what the top_tier engine
# effectively did before ("parity"): it never read the dual-divergence or
# the chart veto, so both are off; the broken-level guard ships off.
shared_entry:
  use_fvg_context: true
  # Veto an entry when RSI AND OBV both diverge against it.
  use_dual_divergence_veto: false  # parity: this strategy never read it before 2026-09-24
  use_technical_entry_adjustment: true
  use_technical_stop_target_refinement: true
  use_structure_filter: true
  use_sr_filter: true
  use_sr_stop_target_refinement: true
  use_htf_divergence_score: true
  use_divergence_entry_signal: false
  divergence_entry_min_age_bars: 0
  divergence_entry_require_sr_confluence: true
  divergence_entry_score_floor: 1.5
  divergence_entry_score_bump: 0.20
  use_opposing_chart_filter: false  # parity: this strategy never read it before 2026-09-24
  use_opposing_candle_filter: false
  # VETO an entry within broken_level_min_clearance_pct (scaled by the symbol's
  # volatility) or _atr of a confirmed broken level beyond it. Moved here from
  # params.reject_entry_near_broken_level (2026-09-24) with this preset's
  # thresholds; it ships off: it existed to keep entries clear of the
  # S/R-loss exit (off), and the setups it alone blocked did no worse than fills.
  use_broken_level_guard: false
  broken_level_min_clearance_pct: 0.0025
  broken_level_min_clearance_atr: 0.72
  # R:R floor for the TARGET side of the SR/technical refinement pipeline.
  min_target_rr: 1.0
  # Floor on how far refinement may pull the STOP toward entry, in ATR14.
  # min_target_rr cannot police the stop side — tightening a stop RAISES
  # reward/risk, so that guard never binds there. Without this floor a
  # support level a few cents under entry produced a few-cent stop,
  # overriding the builder's default_stop_pct backstop. Expressed in ATR so
  # it ports unchanged from the large-cap top_tier tape to $2-20 small-caps.
  min_stop_atr_mult: 1.5

# Shared exit-side toggles — tape-confirmation thresholds and exit gates. Only
# the long (bullish) side is exercised (long-only), but both are declared for
# completeness.
shared_exit:
  use_technical_exit: true
  use_trendline_break: true
  use_channel_break: true
  use_bollinger_reject: false
  use_anchored_vwap_loss: true
  use_chart_pattern_exit: false
  use_structure_exit: true
  use_sr_loss_exit: false  # ships off in every preset (2026-09-24), see config.example.yaml
  use_divergence_exit_signal: false
  divergence_exit_partial_frac: 0.5
  divergence_exit_min_age_bars: 1
  divergence_exit_require_in_profit: true
  confirm_with_ema9: true
  confirm_with_ema20: true
  confirm_with_vwap: true
  confirm_with_close_position: true
  bullish_close_position_max: 0.46
  bearish_close_position_min: 0.54
  bullish_close_position_loose_max: 0.38
  bearish_close_position_loose_min: 0.62
  use_candle_pattern_exit: false
  # Minimum open profit (R) before the discretionary exit families may fire:
  # bias structure exits and the technical exits (trendline / channel /
  # bollinger / anchored-VWAP). None carry an R condition of their own, so
  # below this threshold they act as an arbitrary tightened stop; the
  # protective stop governs instead. CHoCH was always exempt: it is an
  # ungated structural stop-tightener (typically below about -0.4R, on
  # roughly 0.5-1.3% of positions). The S/R-break exit is exempt since
  # 2026-09-24 (it fires only on the losing side of entry, so the gate had
  # kept it dead; it ships off anyway).
  # R-denominated, so it ports across price ranges. NOTE: this preset's
  # ladder is deliberately LATER than top_tier's (breakeven 1.2 vs 0.6) —
  # this gate sits well below it and does not interact.
  discretionary_exit_min_r: 0.5

strategies:
  small_cap_squeeze:
    entry_windows:
      - ["08:05", "11:50"]
    management_windows:
      - ["08:00", "13:00"]
    screener_windows:
      - ["07:45", "11:50"]
    params:
      # ============================ Screener universe ============================
      # Dynamic TradingView screen (no fixed list). Long-only. Targets low-float
      # names already running premarket on heavy volume — squeezing or about to.
      # close / change_from_open / volume auto-resolve to their PREMARKET variants
      # pre-09:30, so these thresholds mean premarket close/change/volume during
      # the 08:05-09:30 window and RTH values after the open.
      min_price: 2.0
      max_price: 20.0
      min_float_shares: 400000          # low float = the squeeze fuel
      max_float_shares: 20000000
      # No market-cap cap (removed 2026-06-01): float (400K-20M) + price ($2-20)
      # define the small bias, so a low-float name of any cap can qualify. (The
      # broad tradingview.max_market_cap above is inert here — this screener uses
      # the type-only equity baseline, not the cap-gated small_cap_base path.)
      min_rvol: 2.0                     # relative_volume_10d_calc (raised from 1.5, 2026-06-01)
      min_change_from_open: 5.0         # >= 5% from open
      min_volume: 5000000              # >= 5M (premarket volume pre-RTH)
      # Hybrid watchlist (2026-06-01): pre-09:30 gappers are STICKY (locked once
      # they qualify, so the pre-open universe doesn't churn); at the open it
      # switches to a live RTH re-screen UNIONED with the locked premarket names
      # (kept warm for a VWAP reclaim), capped to max_candidates by activity.
      # Set 'none' to re-screen every cycle with no premarket lock.
      watchlist_mode: premarket_lock_rth_live

      # ============================ Regimes ============================
      # Narrowed 2026-06-02 (after two dry-runs) to the momentum-continuation set:
      # trend / momentum / vwap_reclaim ONLY. pullback was the worst line both days
      # (0/4 on 06-02 even after the score-floor tightening; ~-$438 over the two
      # runs); range + vol_squeeze (mean-reversion / breakout) don't fit a squeeze-
      # continuation thesis and added noise. ORB + sr_scalp stay off too. With ORB
      # disabled the opening-range carve-out is removed, so the open trades the
      # continuation mix continuously from 08:05.
      disable_orb_regime: true
      disable_sr_scalp_regime: true
      disable_pullback_regime: true     # 0/4 on 06-02, ~2/17 on 06-01 — worst line both days
      disable_range_regime: true        # mean-reversion: wrong thesis for a squeeze
      disable_vol_squeeze_regime: true  # 0/2 on 06-02; folded into trend/momentum

      # VWAP-reclaim regime (opt-in, on for this strategy): a long re-entry when
      # price dips below session VWAP (a flush that shakes out weak longs) then
      # reclaims it on a volume pop — the squeeze re-igniting. Catches the entry
      # that trend (needs close>VWAP & ema9>ema20), pullback (needs to hold above
      # ema20), and momentum (needs a new N-bar high) all miss. Stop below the
      # flush low; target rides toward the HOD.
      disable_vwap_reclaim_regime: false

      # ===== armed retest (added 2026-09-20, OFF here) =====
      # `trend` and `momentum` are this strategy's two live regimes, and in
      # top_tier they now arm on qualification and wait for a retest before
      # entering. This strategy subclasses TopTierAdaptiveStrategy, so it would
      # inherit that from the code default and silently change both of its
      # entry paths -- the same trap the vwap_reclaim knob was shipped opt-IN
      # to avoid on 2026-05-30 (see the polarity note in CHANGELOG).
      #
      # Off here deliberately. The evidence for arming is top_tier's
      # `entry_timing` split on mega caps; a small-cap squeeze that gaps 50%
      # and runs is a different tape, and the 2026-06-02 dry-run is this
      # strategy's baseline for the next one. Turning it on is a separate
      # decision with its own dry-run.
      armed_retest_enabled: false
      min_vwap_reclaim_score: 3.5
      vwap_reclaim_lookback_bars: 6        # the dip must be within the last ~6 min
      # 2026-06-02: tightened the reclaim confirmation. On the 06-02 fady tape
      # vwap_reclaim over-fired on FALSE reclaims (tiny VWAP pokes that failed
      # back, exiting anchored_vwap_loss — ABTS alone took 4 such losers), and the
      # hybrid watchlist amplifies it by keeping faded gappers warm. Require a
      # decisive clear of VWAP + real volume on the reclaim bar.
      vwap_reclaim_min_volume_ratio: 1.5   # was 1.2 — reclaim bar volume vs recent avg
      vwap_reclaim_buffer_pct: 0.0025      # was 0.0005 — clear VWAP decisively, not a 1-tick poke
      vwap_reclaim_target_rr: 2.5          # runner-friendly; ladder/peak-giveback extend past it

      # ===================== No confirmations / no sector =====================
      require_index_confirmation: false
      index_symbols: []
      sector_groups: {}
      sector_index_map: {}
      relative_strength_block_threshold_pct: 0.0
      require_htf_bias_alignment: false       # squeezes break prior 15m structure
      require_htf_pivot_alignment_trend: false

      # ===================== Long-only / extended hours =====================
      # Every screened symbol is extended-hours eligible (dynamic universe, so a
      # hand-listed sublist can't work). Long-only is set via risk.allow_short.
      extended_hours_tradable_all: true

      # ===================== Timeframe (1m LTF) =====================
      # span_scale 1 = native 1m indicators (14 ATR, ...) — responsive and
      # tighter ATR stops, which suits fast squeeze scalps. Raise toward 3-5 to
      # smooth the signals and widen the ATR-based stops (PRIMARY tuning knob).
      # The LTF EMAs the entry scoring reads are set on their own by
      # ltf_ema_fast_span / ltf_ema_slow_span (9 / 20 = native), so the span
      # scale no longer moves them; raise these to smooth the EMA votes alone.
      # Exits read the base 1m frame's native EMA9 / EMA20.
      ltf_minutes: 1
      ltf_indicator_span_scale: 1
      ltf_ema_fast_span: 9
      ltf_ema_slow_span: 20
      # HTF EMA trend inputs (15m): read by the inherited top_tier HTF EMA
      # gate / score term (both off here) and drawn on the HTF chart.
      # require_htf_ema_alignment: enabled / true, long_only, short_only or
      # disabled / false.
      htf_ema_fast_span: 50
      htf_ema_slow_span: 200
      require_htf_ema_alignment: disabled
      htf_ema_alignment_score: 0.0
      min_bars: 20
      min_ltf_bars: 15

      # ===================== KEY squeeze tuning =====================
      # A squeezer is ALWAYS extended (high %B, far above VWAP/EMA, big bars), so
      # the mega-cap "don't chase extension" gates would block nearly every entry.
      # They're off here (and the matching soft-scoring penalties are zeroed in
      # technical_levels above). Keep the SR / broken-level / target-beyond-SR
      # gates (those are about not buying straight into resistance).
      reject_stretched_entries: false
      entry_exhaustion_filter_enabled: false
      reject_oversized_entry_bar: false
      reject_tech_bias_contradiction: false
      pullback_require_real_dip: false        # squeeze pullbacks are shallow/fast

      # Pullback selectivity (2026-06-01 dry-run). The pullback regime over-fired
      # (17 of 28 trades) and lost -$327 — essentially the entire day's loss —
      # by buying post-spike fades on these choppy names (many entries had MFE=0,
      # straight to stop). trend / vwap_reclaim / momentum (which caught every big
      # move) keep their manifest floors. Raised pullback's score floor and require
      # a stronger underlying trend so it only fires on real continuation dips, not
      # rollovers. If pullback still dominates the losses next dry-run, set
      # disable_pullback_regime: true.
      min_pullback_score: 3.5           # manifest default 3.0
      min_pullback_trend_score: 3.0     # manifest default 2.5 — require a real trend under the dip

      # Momentum fires on a strong live move (the screener already gates 5%+).
      momentum_min_day_strength: 3.0
      directional_bias_min_day_strength: 0.5

      # ===================== Hybrid scalp + runner management =====================
      # The adaptive ladder steps the stop and target up through the S/R rungs;
      # it never sells part of the position, so the whole position rides to one
      # exit (the last rung clears the target, and peak-giveback -- loose on
      # high-conviction squeeze days so big moves get room to extend -- trails it).
      # 2026-06-01 dry-run retune: the original 0.6R break-even / 1.1R profit-lock /
      # 0.5R lock moved the stop up so early that routine mid-squeeze pullbacks
      # (these names breathe 15-25% intra-move) stopped runners out at ~1R while
      # they had 3-4R of MFE available (HKIT vwap_reclaim peaked +$94 exited +$29;
      # momentum peaked +$84 exited +$19). Delayed break-even + profit-lock and a
      # wider protected stop so peak_giveback (which captured 2.60R of a 3.33R peak
      # on the one trade it managed) owns the runner instead of being pre-empted.
      adaptive_breakeven_rr: 1.2          # was 0.6 — don't flatten risk until a real cushion
      adaptive_profit_lock_rr: 1.8         # was 1.1 — lock later so early volatility doesn't trip it
      adaptive_profit_lock_stop_rr: 1.0    # was 0.5 — protect 1R when it locks (captures more of the run)
      adaptive_runner_trigger_rr: 1.3
      ladder_max_rungs: 4
      momentum_target_rr: 2.5
      peak_giveback_high_conviction_day_strength_pct: 5.0
      peak_giveback_high_conviction_min_r: 2.5

      # ===================== Time-of-day =====================
      # Continuous full-mix entries 08:05-11:50: premarket (08:05-09:30) via the
      # extended fallthrough, 09:30-11:50 via the primary window (midday_start =
      # no_new = 11:50 collapses the midday/afternoon sub-windows).
      no_new_entries_after: "11:50"
      midday_start_time: "11:50"
      midday_end_time: "11:50"
      afternoon_start_time: "11:50"

      # ===== top_tier engine params, declared at their code defaults (2026-09-22) =====
      # small_cap_squeeze runs top_tier_adaptive's engine, and until now none of
      # these were declared for it: every value below was already in effect,
      # but only as the default inside a `self.params.get(...)` call -- invisible
      # here, and retuned for this preset whenever a code default changed.
      # Values are unchanged from what the bot has been running; tune from here.
      # -- side decision / bias
      bias_penalty_base: 1.0
      bias_penalty_saturate_at: 2.0
      require_explicit_side_decision: true
      respect_screener_bias: true
      short_min_score_premium: 0.0
      short_stop_buffer_mult: 1.0
      short_target_rr_mult: 1.0
      side_decision_majority_frac: 0.6
      side_decision_max_opposing: 1
      side_decision_min_agreeing: 2
      side_decision_recent_threshold_pct: 0.1
      side_decision_vwap_buffer_pct: 0.0005
      trailing_bias_enabled: true
      trailing_bias_lookback: 10
      trailing_bias_majority_threshold: 0.7
      # -- entry gates
      activity_score_weight: 0.12
      entry_bar_body_max_atr_mult: 1.4
      entry_bar_range_max_atr_mult: 1.8
      stretched_atr_mult_max: 1.1
      stretched_cooldown_minutes: 3.0
      stretched_percent_b_max: 0.8
      target_max_sr_ratio: 0.8
      # -- stops / volatility scaling
      adr_lookback_days: 20
      atr_aware_stop_enabled: true
      atr_widening_max_factor: 1.5
      atr_widening_threshold: 1.3
      beta_lookback_days: 60
      early_session_stop_widening_enabled: true
      early_session_stop_widening_mult: 1.3
      early_session_stop_widening_until: "10:30"
      reference_adr_pct: 0.018
      volatility_scale_max: 2.2
      volatility_scale_min: 0.6
      zone_atr_mult: 0.2
      zone_pct: 0.0015
      # -- leg-anchored confirmation / index breadth
      index_breadth_min_agree_frac: 0.5
      index_breadth_min_peers: 3
      leg_anchor_min_age_bars: 20
      leg_anchor_min_impulse_pct: 0.005
      leg_anchored_confirmation: false
      # -- armed retest (armed_retest_enabled is false here)
      armed_retest_invalidation_atr: 0.75
      armed_retest_max_minutes: 12.0
      armed_retest_min_close_position: 0.6
      armed_retest_zone_atr: 0.35
      # -- regimes switched off here (pullback / range / sr_scalp / vol_squeeze / orb)
      disable_orb_window: false
      extended_hours_tradable: []
      min_orb_score: 3.5
      min_sr_scalp_score: 3.5
      orb_breakout_buffer_atr_mult: 0.05
      orb_bypass_exhaustion: true
      orb_bypass_htf_bias: true
      orb_bypass_relative_strength: true
      orb_bypass_screener_bias: true
      orb_bypass_side_decision: true
      orb_max_range_atr_mult: 4.0
      orb_min_range_atr_mult: 0.5
      orb_opposing_sr_atr_mult: 0.5
      orb_range_minutes: 15
      orb_require_5m_followthrough: true
      orb_target_range_mult: 1.5
      pullback_ema_touch_atr_mult: 0.35
      pullback_hold_atr_mult: 0.4
      pullback_max_leg_retrace_pct: 50.0
      pullback_max_minutes_since_session_extreme: 45.0
      pullback_min_leg_retrace_pct: 25.0
      pullback_require_fresh_leg: true
      range_entry_zone_frac: 0.35
      range_max_ema_gap_pct: 0.0008
      range_max_intraday_range_pct: 0.012
      range_min_flip_count: 3
      range_require_prev_bar_confirmation: true
      sr_scalp_max_distance_from_zone_atr: 0.5
      sr_scalp_min_distance_atr: 2.5
      sr_scalp_min_distance_pct: 0.008
      sr_scalp_min_stop_atr_mult: 0.5
      sr_scalp_noise_lookback_bars: 20
      vol_squeeze_breakout_buffer_pct: 0.0008
      vol_squeeze_hard_breakout_gates: true
      vol_squeeze_max_range_atr: 1.8
      vol_squeeze_max_range_pct: 0.012
      vol_squeeze_max_width_pct: 0.05
      vol_squeeze_min_bar_close_position: 0.63
      vol_squeeze_min_breakout_volume_ratio: 1.12
      vol_squeeze_min_pct_b_directional: 0.5
      vol_squeeze_min_sr_bias_alignment: 0.2


      force_flatten:
        long: true
        short: false
pairs: []

# Scheduled-event blackouts, shared by every strategy (equity and options).
# Moved out of `options:` 2026-09-18 — the calendar used to be reachable only
# from the 0DTE options strategy, so equity strategies had no macro-event
# awareness and no earnings awareness at all.
events:
  enabled: true
  # Macro windows (CPI / FOMC / ...). Same schema as before; each event may
  # now also carry `symbols: [...]` to scope the window to specific tickers.
  blackout_file: ./macro_events.auto.yaml
  blackouts: []
  # Per-symbol earnings dates -> {SYMBOL: [YYYY-MM-DD, ...]}. Maintain either
  # here or in the file; both are merged.
  earnings_file: ./earnings.yaml
  earnings: {}
  # Trading sessions either side of an earnings date that block new entries
  # (the date itself is always blocked). Weekend-aware.
  earnings_block_sessions_before: 1
  earnings_block_sessions_after: 1

