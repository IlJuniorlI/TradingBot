# This strategy does not read the event calendar: a hold can span an
# earnings report, as the study's trades did (its README, "What is not
# built").
events:
  enabled: true
  blackout_file: ./macro_events.auto.yaml
  blackouts: []
  earnings_file: ./earnings.yaml
  earnings: {}
  earnings_block_sessions_before: 1
  earnings_block_sessions_after: 1
strategies:
  swing_leader_pullback:
    # Entries near the open only: the rule buys the session after the setup
    # at its open. A start after 10:00 skips the day's setups.
    entry_windows:
    - - 09:31
      - '10:00'
    management_windows:
    - - 09:30
      - '16:00'
    # From 09:00: the leaders' 1m and daily history is fetched before the
    # open, not in one burst at the first entry pass. The rank does not move
    # with the session, so an early screen is the same screen.
    screener_windows:
    - - 09:00
      - '10:00'
    params:
      # The universe the leaders are ranked in: TradingView index ids.
      index_universe:
      - SYML:SP;SPX
      - SYML:NASDAQ;NDX
      # Fewer rankable members than this in the screener's answer: no leaders.
      min_universe_size: 300
      # The top tenth by 12-1 momentum.
      leader_fraction: 0.1
      # Floors read on the daily bars: the last close and the 20-session
      # median of close x volume.
      min_price: 5.0
      min_dollar_volume: 20000000.0
      # The setup, on the last completed session: close above the 200-session
      # SMA, RSI(2) under 10.
      trend_sma: 200
      rsi_length: 2
      rsi_max: 10.0
      # The stop: 2 x the 14-session ATR under the entry.
      atr_length: 14
      stop_atr_mult: 2.0
      # The exits near the close: the price above the 5-session SMA (today
      # included), or the 10th session after the entry's.
      exit_sma: 5
      max_hold_sessions: 10
      # The exit check opens this long before the session's close (10
      # minutes; an early-close day checks 10 minutes before its own close).
      exit_check_time: '15:50'
pairs: []
