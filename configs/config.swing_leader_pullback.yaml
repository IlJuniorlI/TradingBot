  divergence_entry_score_bump: 0.2
  use_technical_entry_adjustment: false
  use_technical_stop_target_refinement: false
  use_structure_filter: false
  use_sr_filter: false
  use_sr_stop_target_refinement: false
  use_broken_level_guard: false
