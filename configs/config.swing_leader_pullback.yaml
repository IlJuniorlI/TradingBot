# swing_leader_pullback: buy a momentum leader's short pullback at the open and
# hold it for days (the strategy's README has the rule and its measurement).
# DRY RUN ONLY: the strategy refuses to build with schwab.dry_run false.
#
# What makes this preset a swing preset, each explained where it is set:
#   risk.trade_management_mode none, peak giveback off, time stop off,
#   every shared_entry veto / refinement / score term off, the shared_exit
#   families off, execution.extended_hours_enabled false,
#   runtime.auto_exit_after_session false.
# Put SCHWAB_APP_KEY, SCHWAB_APP_SECRET, SCHWAB_ACCOUNT_HASH and SCHWAB_ENCRYPTION_KEY in a .env file at the repo root.
strategy: swing_leader_pullback
schwab:
  callback_url: https://127.0.0.1
  tokens_db: .schwabdev/tokens.db
  timeout: 10
  dry_run: true
  open_browser_for_auth: true
tradingview:
  market: america
  max_candidates: 10
  screener_refresh_seconds: 60
  # The five filters below are the shared screener helpers'. This strategy's
  # screener applies none of them: its universe is the members of
  # strategies.swing_leader_pullback.params.index_universe.
  min_market_cap: 30000000
  max_market_cap: 2000000000
  min_volume: 550000
  min_value_traded_1m: 100000.0
  min_volume_1m: 8000
paper:
  # Ten slots of max_notional_per_trade.
  starting_equity: 50000.0
  max_equity_points: 2000
  equity_point_seconds: 15
  max_trade_history: 200
risk:
  # The study's book: at most ten positions, equal slices, the most oversold
  # first (the strategy's score).
  max_positions: 10
  # The stop sits 2 daily ATRs under the entry, about 6% of the price on the
  # leaders this trades. At 0.06 a slice is filled whole when the stop is no
  # wider than 6% and cut down in proportion when it is wider, so a stop-out
  # costs at most about 6% of a slice.
  risk_per_trade_frac_of_notional: 0.06
  max_notional_per_trade: 5000.0
  max_total_notional: 50000.0
  # Open risk to the stops counts against it (daily_loss_includes_open_risk),
  # and the positions are carried, so it must hold ten slices' risk (10 x 300)
  # or the book could never fill.
  max_daily_loss: 3500.0
  # Not this strategy's levels (its stop is 2 daily ATRs, no target): the
  # fallback the entry stage books when a fill lands beyond the signal's own.
  default_stop_pct: 0.018
  default_target_pct: 0.038
  trailing_stop_pct: 0.014
  trail_activation_r: 0.5
  # none: no break-even, profit lock, runner or trail. The exits are the
  # stop and the strategy's own close-time exit.
  trade_management_mode: none
  allow_short: false
  # Longer than a session: a symbol stopped out is not bought again the same
  # day on the same setup.
  cooldown_minutes: 480
  reentry_policy: cooldown
  cooldown_direction_aware: true
  same_level_block_minutes: 30
  same_level_block_atr_mult: 0.3
  # Off: it counts wall-clock minutes, nights included.
  time_stop_minutes: 0
  time_stop_min_return_pct: 0.003
  time_stop_min_r: 0.3
  entry_min_target_rr_at_limit: 1.0
  # Off: the rule sells the bounce at the close, not a retrace from a peak.
  peak_giveback_enabled: false
  peak_giveback_min_r: 1.0
  peak_giveback_low_tier_enabled: false
  peak_giveback_low_tier_min_r: 0.7
  peak_giveback_low_tier_giveback_frac: 0.7
  peak_giveback_retain_1to2r: 0.65
  peak_giveback_retain_2to3r: 0.72
  peak_giveback_retain_3r_plus: 0.78
  entry_slippage_allowance_spread_frac: 1.0
  entry_slippage_allowance_max_pct: 0.002
  risk_overage_warn_frac: 0.15
  entry_slippage_warn_pct: 0.0015
  daily_loss_includes_open_risk: true
runtime:
  loop_sleep_seconds: 2.0
  error_escalation_cycles: 10
  schwab_login_warning_hours: 24
  history_poll_seconds: 300
  quote_poll_seconds: 6
  quote_cache_seconds: 6
  stream_quotes: true
  stream_quote_shadow_every: 20
  quote_batch_size: 50
  history_lookback_minutes: 780
  use_extended_hours_history: true
  use_rth_session_indicators: true
  equity_session_indicator_window: rth
  warmup_minutes: 150
  prewarm_before_windows_minutes: 15
  # Its own folder for logs, trades.csv, the day's figures and the saved
  # positions: a second bot started from the same directory (top_tier on
  # .logs) would otherwise share them, and its first save would delete this
  # strategy's saved positions, the ones a restart takes back.
  log_dir: .logs_swing
  stream_fields:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  stream_connect_timeout_seconds: 20
  stream_fallback_poll_seconds: 25
  stream_stale_fallback_seconds: 180
  stream_health_log_seconds: 90
  # false: the process stays up to carry its positions. A restart takes the
  # open paper positions back, but nothing is simulated while it is down.
  auto_exit_after_session: false
  idle_sleep_seconds: 60.0
  symbol_state_prune_seconds: 1800.0
  session_reconcile_on_resume: true
  cycle_fetch_workers: 4
  max_consecutive_quote_failures: 5
  context_memo_shadow_every: 20
  export_session_archive: true
  log_position_marks: true
  reconcile_on_startup: true
  # A dry run's positions are not in the broker account, so there is nothing
  # to reconcile against. These two are the dry run's values: a live run of
  # this strategy (refused today) would also be refused at load with them,
  # which asks for restore_hybrid and an order lookback of at least 20 days
  # for the 10-session hold (the strategy's README, "The live path").
  startup_reconcile_mode: ignore
  startup_order_lookback_days: 2
  startup_reconcile_ignore_symbols: []
  startup_reconcile_metadata_db_path: .logs_swing/startup_reconcile_metadata.sqlite
execution:
  entry_limit_min_buffer: 0.03
  entry_limit_max_buffer: 0.05
  entry_limit_spread_frac: 0.1
  entry_live_fill_timeout_seconds: 2.0
  entry_live_poll_seconds: 0.25
  entry_live_reprice_attempts: 2
  entry_live_reprice_step_frac: 0.33
  # false: entries and exits in the regular session only. The stop of a
  # position that gaps overnight is judged at the open, as the study filled
  # it, not on a 07:00 premarket quote.
  extended_hours_enabled: false
  market_exit_regular_hours: false
  exit_live_reprice_attempts: 2
  exit_live_reprice_step_frac: 0.5
  exit_live_reprice_max_seconds: 12.0
  exit_live_market_fallback: false
  bracket_orders_enabled: false
  bracket_sync_mode: static
  bracket_legs: stop_and_target
  bracket_stop_order_type: STOP
  bracket_stop_limit_offset_r: 0.5
  bracket_require_normal_session: true
  bracket_replace_min_price_delta: 0.01
  disaster_stop_enabled: true
  disaster_stop_r: 1.0
  disaster_stop_min_pct: 0.0025
  disaster_stop_escalation_attempts: 3
candles:
  bullish_patterns:
  - bullish_1c
  - bullish_2c
  - bullish_3c
  bearish_patterns:
  - bearish_1c
  - bearish_2c
  - bearish_3c
  opposing_net_score_threshold: 0.7
chart_patterns:
  enabled: true
  lookback_bars: 32
  bullish_patterns:
  - bullish_double_bottom
  - bullish_inverse_head_and_shoulders
  - bullish_falling_wedge
  - bullish_broadening_bottom
  - bullish_triple_bottom
  - bullish_flag
  - bullish_pennant
  - bullish_ascending_triangle
  - bullish_symmetrical_triangle
  bearish_patterns:
  - bearish_double_top
  - bearish_head_and_shoulders
  - bearish_rising_wedge
  - bearish_broadening_top
  - bearish_triple_top
  - bearish_flag
  - bearish_pennant
  - bearish_descending_triangle
  - bearish_symmetrical_triangle
dashboard:
  enabled: true
  host: 127.0.0.1
  # Its own port, one above every other preset's 8765: this strategy runs
  # as a second bot beside a day-trading one, and the second bot to ask for
  # a port in use starts with no dashboard (logged, not fatal).
  port: 8766
  refresh_ms: 1500
  state_path: .logs_swing/dashboard_state.json
  client_idle_seconds: 30.0
  idle_publish_seconds: 60.0
  state_write_seconds: 30
  theme: default
  https: false
  ssl_certfile: ''
  ssl_keyfile: ''
  charting:
    compact_chart_timeframe: ltf
    compact:
      max_bars: 90
      show_volume: false
      show_moving_averages: true
      show_vwap: true
      show_support_resistance: true
      show_next_support_resistance: true
      show_full_support_resistance_ladder: false
      show_key_level_zones: true
      show_key_level_zone_labels: true
      show_bollinger_bands: false
      show_anchored_vwap: false
      show_fib_extensions: false
      show_fib_retracements: false
      show_channel: false
      show_trendlines: false
      show_htf_fair_value_gaps: false
      show_ltf_fair_value_gaps: false
      show_htf_order_blocks: false
      show_ltf_order_blocks: false
      show_rsi_divergence: true
      show_obv_divergence: false
      show_trade_markers: true
      tooltip_show_returns: true
      tooltip_show_support_resistance: true
      tooltip_show_structure: true
      tooltip_show_volatility: true
      tooltip_show_orderflow: true
      tooltip_show_patterns: true
    expanded:
      max_bars: 360
      show_volume: true
      show_moving_averages: true
      show_vwap: true
      show_support_resistance: true
      show_next_support_resistance: true
      show_full_support_resistance_ladder: true
      show_key_level_zones: true
      show_key_level_zone_labels: true
      show_bollinger_bands: true
      show_anchored_vwap: true
      show_fib_extensions: true
      show_fib_retracements: true
      show_channel: false
      show_trendlines: false
      show_htf_fair_value_gaps: false
      show_ltf_fair_value_gaps: false
      show_htf_order_blocks: false
      show_ltf_order_blocks: false
      show_rsi_divergence: true
      show_obv_divergence: false
      show_trade_markers: true
      tooltip_show_returns: true
      tooltip_show_support_resistance: true
      tooltip_show_structure: true
      tooltip_show_volatility: true
      tooltip_show_orderflow: true
      tooltip_show_patterns: true
