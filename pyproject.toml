[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intraday-tv-schwab-bot"
dynamic = ["version"]
description = "Intraday trading bot combining TradingView screener candidates with Schwab execution."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "IlJuniorlI" },
]
requires-python = ">=3.11"
dependencies = [
    "schwabdev==4.0.0",
    "tradingview-screener==3.2.2",
    "pandas==3.0.6",
    "numpy==2.4.6",
    "PyYAML==6.0.3",
    "TA-Lib==0.8.0",
]

# Test + lint tooling. These were previously installed in the working venv but
# declared nowhere, so `pip install -e .` produced a package that could not be
# tested and nothing recorded which versions the suite had been run against.
#     pip install -e ".[dev]"
# pytest-xdist runs the suite in parallel: pytest -n 24 --dist loadfile
[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-xdist==3.8.0",
    "hypothesis==6.151.12",
    "flake8==7.3.0",
    "vermin==1.8.0",
    "vulture==2.16",
    "pandas-stubs==2.3.3.260113",
    "build==1.4.3",
]

[project.scripts]
intraday-tv-schwab-bot = "intraday_tv_schwab_bot.cli:main"

# The version file is package data: intraday_tv_schwab_bot.__version__ reads
# the same file, so the wheel's metadata and the imported package agree.
[tool.setuptools.dynamic]
version = { file = "intraday_tv_schwab_bot/VERSION" }

# The two microcap strategy plugins live only in the private source tree (git
# leaves them out), and the bot loads them from that checkout. No build takes
# them: not their modules (packages.find), not their manifest.json and
# README.md (exclude-package-data), and not what an earlier build's egg-info
# SOURCES.txt lists (MANIFEST.in).
[tool.setuptools.packages.find]
include = ["intraday_tv_schwab_bot*"]
exclude = [
    "tests*",
    "scripts*",
    "theme_previews*",
    "intraday_tv_schwab_bot._strategies.microcap_gap_orb",
    "intraday_tv_schwab_bot._strategies.microcap_pm_breakout",
]

[tool.setuptools.package-data]
intraday_tv_schwab_bot = [
    "VERSION",
    "_strategies/*/manifest.json",
    "_strategies/*/README.md",
    "dashboard_assets/*",
    "dashboard_assets/**/*",
]

[tool.setuptools.exclude-package-data]
intraday_tv_schwab_bot = [
    "_strategies/microcap_gap_orb/*",
    "_strategies/microcap_pm_breakout/*",
]
